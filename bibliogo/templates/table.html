{% extends 'layouts/base.html' %}


{% block content %}

<!-- Table Start -->
<div class="container-sm">
  <div class="row g-4 ">
    <div class="col-12 mt-5">
      <div class="">
        <div class="card-body">
          <h3 class="card-title mb-4">Lista de alumnos</h3>
          <form id="searchForm" class="mb-4">
            <div class="input-group">
              <input type="text" id="granjaInput" class="form-control" placeholder="Nombre de el alumno" required>
              <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
          </form>
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr class="table">
                  <th scope="col">DNI</th>
                  <th scope="col">Nombres</th>
                  <th scope="col">Apellido paterno</th>
                  <th scope="col">Apellido materno</th>
                </tr>
              </thead>
              <tbody id="alumnosContenedor">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="">
        <div class="card-body">
          <h3 class="card-title mb-4">Lista de libros</h3>
          <form id="searchForm" class="mb-4">
            <div class="input-group">
              <input type="text" id="granjaInput" class="form-control" placeholder="Nombre de el libro" required="">
              <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
          </form>
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr class="table">
                  <th scope="col">ISBN</th>
                  <th scope="col">TITULO</th>
                  <th scope="col">AUTOR</th>
                  <th scope="col">CATEGORIA</th>
                  <th scope="col">CANTIDAD</th>
                </tr>
              </thead>
              <tbody id="librosContenedor">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="">
        <div class="card-body">
          <h3 class="card-title mb-4">Lista de prestamos</h3>
          <form id="searchForm" class="mb-4">
            <div class="input-group">
              <input type="text" id="granjaInput" class="form-control" placeholder="Dni de alumno" required="">
              <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
          </form>
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr class="table">
                  <th scope="col">Nombre</th>
                  <th scope="col">Libro</th>
                  <th scope="col">Fecha de prestamo</th>
                  <th scope="col">Fecha de devolucion</th>
                </tr>
              </thead>
              <tbody id="prestamosContenedor">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Table End -->

  {% endblock %}
