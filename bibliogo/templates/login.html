<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>
    <div class="title mt-5" >
        <img src="{% static 'img/logo.png' %}" alt="BIBLIOGO" class="logo-img" >
        <h1 class="title">BIBLIOGO</h1>
    </div>
    <div class="container login-container mt-0">
        <div class="card shadow">
            <div class="card-header text-center py-3">
                <h3 class="mb-0">Inicio de sesión</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        {{form.username}}
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        {{form.password}}
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-lg btn-primary ">Iniciar sesión</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    {% if error %}
    <script>
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: "{{ error }}",
            width: 300,
            height: 300,
        });
    </script>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
